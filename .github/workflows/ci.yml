name: Build

# Every push / pull request builds the portable Linux and Windows packages
# and uploads them as workflow artifacts. Pushing a tag "v*" also publishes
# them on a GitHub Release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Fast developer build: system compiler + AddressSanitizer/UBSan, then a
  # smoke test of the server (start, accept a TCP connection, clean stop).
  dev-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Configure (Debug + ASan/UBSan)
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan
      - name: Server smoke test
        run: |
          STATE=$(mktemp -d)
          export ASAN_OPTIONS=detect_leaks=0
          ./build-asan/dragongl_server --local -P 18080 -p ci -D data -S "$STATE" \
            --stop-file "$STATE/stop" > server.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/18080) 2>/dev/null; then echo "server is up"; break; fi
            sleep 1
          done
          (exec 3<>/dev/tcp/127.0.0.1/18080) || { cat server.log; exit 1; }
          touch "$STATE/stop"
          wait $PID || { cat server.log; exit 1; }
          tail -n 5 server.log

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built inside an Ubuntu 18.04 container (glibc 2.27): the binaries
      # run on practically every desktop distribution of the last years.
      - name: Build portable Linux package
        run: tools/build_release.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: DragonGL-linux-x86_64
          path: dist/*.tar.gz

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 cmake ninja-build zip
      - name: Build portable Windows package
        run: tools/build_release.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: DragonGL-windows-x64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
